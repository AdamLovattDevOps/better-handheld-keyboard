name: Release

# Push a tag, get a release. Notes come from the matching CHANGELOG.md section, so the
# changelog is the single source of truth and there's nothing to copy by hand.
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read notes for this version from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The section runs from its own '## v<version>' heading to the next '## ' heading.
          awk -v v="$version" '
            $0 ~ "^## v" v "([^0-9.]|$)" { found = 1; sub(/^## /, ""); title = $0; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          title=$(awk -v v="$version" '$0 ~ "^## v" v "([^0-9.]|$)" { sub(/^## /, ""); print; exit }' CHANGELOG.md)
          if [ ! -s notes.md ] || [ -z "$title" ]; then
            echo "::error::CHANGELOG.md has no '## v$version' section — add one before tagging."
            exit 1
          fi
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Package the tree
        run: |
          set -euo pipefail
          name="better-handheld-keyboard-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          rsync -a --exclude .git --exclude .github --exclude dist --exclude notes.md ./ "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && zip -qr "$name.zip" "$name")

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag like v1.1.0-rc1 ships as a pre-release.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file notes.md \
            $prerelease \
            dist/*.tar.gz dist/*.zip
